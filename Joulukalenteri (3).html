<!DOCTYPE html>
<html lang="fi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joulukalenteri</title>
    <link rel="stylesheet" href="tyylit.css">
</head>

<body>
    <style>
        body {
            background-image: url(https://pbs.twimg.com/media/G6q3I0fXYAEaHrT?format=png&name=small);
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-size: cover;
        }
    </style>
    <div class="Otsikko">
        <h1> Joulukalenteri </h1>
    </div>

    <div id="Kalenteri" class="grid">
        <div class="Luukku" data-day="1"> 1. Päivä</div>
        <div class="Luukku" data-day="2">2. Päivä</div>
        <div class="Luukku" data-day="3">3. Päivä</div>
        <div class="Luukku" data-day="4">4. Päivä</div>
        <div class="Luukku" data-day="5">5. Päivä</div>
        <div class="Luukku" data-day="6">6. Päivä</div>
        <div class="Luukku" data-day="7">7. Päivä</div>
        <div class="Luukku" data-day="8">8. Päivä</div>
        <div class="Luukku" data-day="9">9. Päivä</div>
        <div class="Luukku" data-day="10">10. Päivä</div>
        <div class="Luukku" data-day="11">11. Päivä</div>
        <div class="Luukku" data-day="12">12. Päivä</div>
        <div class="Luukku" data-day="13">13. Päivä</div>
        <div class="Luukku" data-day="14">14. Päivä</div>
        <div class="Luukku" data-day="15">15. Päivä</div>
        <div class="Luukku" data-day="16">16. Päivä</div>
        <div class="Luukku" data-day="17">17. Päivä</div>
        <div class="Luukku" data-day="18">18. Päivä</div>
        <div class="Luukku" data-day="19">19. Päivä</div>
        <div class="Luukku" data-day="20">20. Päivä</div>
        <div class="Luukku" data-day="21">21. Päivä</div>
        <div class="Luukku" data-day="22">22. Päivä</div>
        <div class="Luukku" data-day="23">23. Päivä</div>
        <div class="Luukku" data-day="24">Jouluaatto</div>
    </div>

    <script>

        const viestit = [

            "Mikä on Maija Mehiläisen isän nimi? Faija Mehiläinen",

            "Joka kahvia keittää se hymyjä kylvää",

            "Mihin ongelmaan ikeassa asioiminen johtaa? Se johtaa keskivaikeaan asennukseen",

            "Mikä on maailman suosituin vihannes? Se on tietty best selleri!",

            "Millaiset talvirenkaat on suklaasta tehdyssä autossa? No KITKAT!",

            "Ketä olivat maailman ensimmäiset suomalaiset? Ne oli Alko asukkaita!",

            "Mikä on kahvin juojan pääkaupunki? Se on kuppikunta!",

            "Mikä ompi italialainen pappi? Se nimi on ei pastori vaan pastari!",

            "Mitä käy kun googlaa sanan matata? No silloin on hakuna matata!",

            "Mikä Teräsmies on aamulla? Se on silloin Heräsmies!",

            "Mikä on kirjolohen äidin nimi? Se on Pirjo Lohi!",

            "Kuka keksi Kuuban ruokakulttuurin? Se oli tietty Fidel Gastro!",

            "Miten koira saa tietää tietoa? No tietty Google-haulla!",

            "Mitä tapahtui kun tontulla jäi lakki kotio? Sillä jäätyi korva tunturilla Korvatunturilla!",

            "Miksi Fazer ei perusta omaa lätkä joukkuettaan? Ne tekee niin paljon Omareita!",

            "Miksi Americassa ei oo enään mansikoita? koska John Wayne!!!",

            "Minä oon tekevinäni töitä kun yhtiö on maksavinaan palkkaa!",

            "Miksi Sveitsi on basistin lempimaa? koska se on nelikielinen!",

            "Mikä on maailman eniten matkustava kala? Se on made koska aina näkyy että Made in China ja Made in Finland!",

            "Miksi Darth Vader joutui menemään optikolle? koska ei enään nähnyt Lukea!",

            "Muut rokkarit ilahtuivat, mutta Tom Petty!",

            "Mikä on etätyövampyyrin päivän tärkein ateria? Tietysti aamupalaveri!",

            "Mikä oli korona-ajan suosituin komedialeffa? Sen nimi on Yskin Kotona!",

            "Mitä käy kun hipsteri tekee källin? Siitä tulee silloin hupsteri!",
        ];
        function avaaLuukku(luukku) {
            const paiva = luukku.dataset.day;

            const viesti = viestit[paiva - 1];
            luukku.classList.add("avattu");
            setTimeout(() => {
                luukku.innerHTML = `<p>${viesti}</p>`;
            }, 600);

        }


        document.addEventListener("DOMContentLoaded", () => {
            const luukut = document.querySelectorAll(".Luukku");
            const tanaan = new Date();
            const paiva = tanaan.getDate();
            const avattavaPaiva = Math.min(paiva, 24);

            luukut.forEach(luukku => {
                const day = Number(luukku.dataset.day);

                if (day <= avattavaPaiva) {
                    luukku.onclick = () => avaaLuukku(luukku);

                } else {
                    luukku.classList.add("disabled");
                    luukku.style.pointerEvents = "none";
                }
            });
        });


    </script>
</body>

</html>
